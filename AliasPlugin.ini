; AliasPlugin configuration (keep this file next to AliasPlugin.dll)
; By default only Alias.txt in this folder is read (file name is case-insensitive); other .txt files are ignored.
; Keys may be repeated; environment variables such as %LOCALAPPDATA% are expanded.
; As soon as any AliasFile / AliasFolder line is present, the default is no longer used.

;AliasFile=%LOCALAPPDATA%\CRC\Aliases\ZLA.txt      <- a specific file, any file name
;AliasFolder=D:\MyAliases                          <- reads Alias.txt in that folder

; Altitudes at or above this value are shown as FLxxx, otherwise in feet
TransitionAltitude=11000

; false = aliases work in every vatSys text box (recommended)
; true  = only in message windows (chat windows / Message Editor / VSCS text box)
ChatWindowOnly=false

; ---------------- Callsign box ----------------
; Adds a callsign box to the left of the message box: filled with the aircraft selected in vatSys,
; and the callsign is prefixed to every message you send.
CallsignBox=true
; Windows that get a callsign box: VSCSWindow = VSCS frequency text box, ChatWindow = chat windows
CallsignBoxWindows=VSCSWindow,ChatWindow
; Send format: {cs} = callsign, {msg} = what you typed
CallsignFormat={cs}, {msg}

; true = write every Enter key event to Documents\vatSys Files\AliasPlugin_log.txt (troubleshooting)
Debug=false
